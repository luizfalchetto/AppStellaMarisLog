name: Gerar APK do motorista
on:
  workflow_dispatch:
  push:
    paths:
      - 'apk-src/**'
      - '.github/workflows/android.yml'
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Montar projeto
        run: |
          mkdir src
          base64 -d apk-src/pack.b64 | tar xz -C src
      - name: Compilar
        working-directory: src
        run: gradle assembleRelease --no-daemon --stacktrace
      - name: Guardar APK
        run: |
          mkdir -p download
          cp src/app/build/outputs/apk/release/app-release.apk download/StellaMarisMotorista.apk
      - uses: actions/upload-artifact@v4
        with:
          name: StellaMarisMotorista
          path: download/StellaMarisMotorista.apk
      - name: Publicar no site
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add download/StellaMarisMotorista.apk
          git commit -m "APK do motorista (build ${{ github.run_number }})" || echo "sem mudanças"
          git pull --rebase origin main
          git push origin HEAD:main

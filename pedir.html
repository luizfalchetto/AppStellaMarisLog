<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Stella Maris Ride · Solicitar corrida</title>
<meta name="theme-color" content="#020D1F">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&display=swap">
<style>
:root{--bg:#020D1F;--panel:#0A1830;--line:#1D3258;--fg:#ECEFF5;--muted:#8C9BB5;--taxi:#DDB066;--ink:#1A1204;--ok:#3DD68C;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.4 "Barlow",system-ui,sans-serif;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
.app{max-width:520px;margin:0 auto;padding:20px 16px 40px;display:grid;gap:16px}
h1{margin:0;font:700 30px/1 "Barlow Condensed",sans-serif;letter-spacing:.04em;text-transform:uppercase}
h1 span{color:var(--taxi)}
.sub{color:var(--muted);margin:4px 0 0}
.field{display:grid;gap:6px}
label{font-size:14px;color:var(--muted)}
input,textarea{background:var(--panel);border:1px solid var(--line);border-radius:12px;min-height:52px;padding:0 14px;font:inherit;font-size:18px;color:var(--fg);width:100%}
textarea{padding:12px 14px;min-height:72px;resize:vertical}
input:focus,textarea:focus{outline:2px solid var(--taxi);outline-offset:1px}
.row{display:flex;gap:8px}.row input{flex:1}
.mini{border:1px solid var(--line);background:var(--panel);color:var(--fg);border-radius:12px;padding:0 14px;min-height:52px;font:600 14px "Barlow",sans-serif;cursor:pointer;white-space:nowrap}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg button{min-height:52px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--fg);font:700 16px "Barlow Condensed",sans-serif;letter-spacing:.06em;text-transform:uppercase;cursor:pointer}
.seg button[aria-pressed=true]{background:var(--taxi);color:var(--ink);border-color:var(--taxi)}
.go{border:0;border-radius:14px;min-height:60px;background:var(--taxi);color:var(--ink);font:700 20px "Barlow Condensed",sans-serif;letter-spacing:.06em;text-transform:uppercase;cursor:pointer}
.go:disabled{opacity:.6}
.est{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;gap:4px}
.est b{font:700 28px "Barlow Condensed",sans-serif;color:var(--taxi)}
.est small{color:var(--muted)}
.hint{color:var(--muted);font-size:13px;margin:0}
.err{color:#ff8a80;font-size:14px;margin:0}
.lg{display:flex;margin-bottom:8px}.lg .logo{width:44px;height:44px}
fieldset{border:0;padding:0;margin:0;display:grid;gap:10px}
legend{padding:0;margin-bottom:6px;font:700 16px "Barlow Condensed",sans-serif;letter-spacing:.08em;text-transform:uppercase;color:var(--taxi)}
.g2{display:grid;grid-template-columns:100px 1fr;gap:8px}
#st{display:grid;gap:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;display:grid;gap:8px;text-align:center}
.card .pos{font:700 54px/1 "Barlow Condensed",sans-serif;color:var(--taxi)}
.card .tit{font:700 22px/1.1 "Barlow Condensed",sans-serif;letter-spacing:.04em;text-transform:uppercase}
.card p{margin:0;color:var(--muted)}
.card .eta{color:var(--fg);font-size:18px}
.lnk{display:block;text-align:center;text-decoration:none;border:1px solid var(--line);background:var(--panel);color:var(--fg);border-radius:12px;padding:14px;font:600 15px "Barlow",sans-serif;cursor:pointer;width:100%}
.lnk.red{color:#ff8a80}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="lg"><svg class="logo" viewBox="0 0 100 100" aria-hidden="true"><defs><linearGradient id="lg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F1D18D"/><stop offset="1" stop-color="#C8933A"/></linearGradient></defs><path fill="url(#lg)" fill-rule="evenodd" d="M50 0L58.7 40.9L98.2 50L58.7 59.1L50 100L41.3 59.1L1.8 50L41.3 40.9ZM50 0L53.6 44L98.2 50L53.6 56L50 100L46.4 56L1.8 50L46.4 44Z"/></svg></div><h1>Stella Maris <span>Ride</span></h1>
    <p class="sub" id="sub">Informe partida e destino e envie o pedido.</p>
  </header>
  <section id="st" hidden>
    <div class="card"><div class="tit" id="stT"></div><div class="pos" id="stP"></div><p class="eta" id="stE"></p><p id="stD"></p></div>
    <button class="lnk" type="button" id="stW">Avisar também pelo WhatsApp</button>
    <button class="lnk red" type="button" id="stC">Cancelar pedido</button>
    <button class="lnk" type="button" id="stN" hidden>Fazer novo pedido</button>
  </section>
  <form id="f" class="app" style="padding:0" autocomplete="off" novalidate>
    <div class="field"><label for="nome">Seu nome</label><input id="nome" required placeholder="Ex.: Dona Marta"></div>
    <div class="field"><label for="fone">Seu telefone (opcional)</label><input id="fone" type="tel" inputmode="tel" placeholder="(22) 99999-9999"></div>
    <div class="field"><label>Para quem é a corrida?</label>
      <div class="seg"><button type="button" id="bMim" aria-pressed="true">Para mim</button><button type="button" id="bOutro" aria-pressed="false">Para outra pessoa</button></div>
    </div>
    <fieldset id="fPass" hidden><legend>Quem vai viajar</legend>
      <div class="field"><label for="pNome">Nome do passageiro</label><input id="pNome" placeholder="Ex.: João"></div>
      <div class="field"><label for="pFone">Telefone do passageiro (opcional)</label><input id="pFone" type="tel" inputmode="tel" placeholder="(22) 99999-9999"></div>
    </fieldset>
    <fieldset><legend>Partida</legend>
      <button class="mini" type="button" id="loc">📍 Usar minha localização</button>
      <div class="field"><label for="oRua">Rua</label><input id="oRua" placeholder="Nome da rua" autocomplete="off"></div>
      <div class="g2"><div class="field"><label for="oNum">Número</label><input id="oNum" inputmode="numeric" placeholder="123" autocomplete="off"></div><div class="field"><label for="oBai">Bairro</label><input id="oBai" placeholder="Bairro" autocomplete="off"></div></div>
      <div class="field"><label for="oCid">Cidade</label><input id="oCid" value="Macaé" autocomplete="off"></div>
    </fieldset>
    <fieldset><legend>Destino</legend>
      <div class="field"><label for="dRua">Rua</label><input id="dRua" placeholder="Nome da rua" autocomplete="off"></div>
      <div class="g2"><div class="field"><label for="dNum">Número</label><input id="dNum" inputmode="numeric" placeholder="123" autocomplete="off"></div><div class="field"><label for="dBai">Bairro</label><input id="dBai" placeholder="Bairro" autocomplete="off"></div></div>
      <div class="field"><label for="dCid">Cidade</label><input id="dCid" value="Macaé" autocomplete="off"></div>
    </fieldset>
    <div class="field"><label>Quando?</label>
      <div class="seg"><button type="button" id="bAgora" aria-pressed="true">Agora</button><button type="button" id="bAgend" aria-pressed="false">Agendar</button></div>
    </div>
    <div class="field" id="fQuando" hidden><label for="quando">Data e hora</label><input id="quando" type="datetime-local"></div>
    <div class="field"><label for="obs">Observações (opcional)</label><textarea id="obs" placeholder="Ponto de referência, nº de passageiros, bagagem…"></textarea></div>
    <div class="est" id="est" hidden></div>
    <button class="mini" type="button" id="bEst" hidden>Calcular estimativa de valor</button>
    <p class="err" id="err" hidden></p>
    <button class="go" type="submit" id="go">Enviar pedido</button>
    <p class="hint">Você entra na fila de atendimento e acompanha sua posição aqui. O motorista confirma o valor final. A estimativa é aproximada: o valor final é o do taxímetro.</p>
  </form>
</div>
<script>
(() => {
'use strict';
const $ = id => document.getElementById(id);
const q = new URLSearchParams(location.search);
const W = (q.get('w') || '5522999299851').replace(/\D/g, '');
const nm = q.get('n') || '';
const num = k => { const v = parseFloat(String(q.get(k) || '').replace(',', '.')); return isFinite(v) ? v : 0; };
const T = (q.has('b') || q.has('k') || q.has('m')) ? {band: num('b'), km: num('k'), min: num('m')} : {band: 5.5, km: 5, min: 0.4};
const temTarifa = T.band > 0 || T.km > 0 || T.min > 0;
if(nm) $('sub').textContent = `Pedido para ${nm}. Informe partida e destino e envie o pedido.`;
if(!W){ $('err').hidden = false; $('err').textContent = 'Link incompleto: peça ao motorista um novo link.'; }
let agendar = false, pO = null, pD = null, est = null;
const brl = v => v.toLocaleString('pt-BR', {minimumFractionDigits:2, maximumFractionDigits:2});
function setQuando(a){ agendar = a; $('bAgora').setAttribute('aria-pressed', !a); $('bAgend').setAttribute('aria-pressed', a); $('fQuando').hidden = !a; }
$('bAgora').onclick = () => setQuando(false); $('bAgend').onclick = () => setQuando(true);
if(temTarifa) $('bEst').hidden = false;
const addr = p => { const g = id => $(p + id).value.trim(); return [[g('Rua'), g('Num')].filter(Boolean).join(', '), g('Bai'), g('Cid')].filter(Boolean).join(' - '); };
const addrQ = (p, simples) => { const g = id => $(p + id).value.trim(); return [[g('Rua'), simples ? '' : g('Num')].filter(Boolean).join(' '), simples ? '' : g('Bai'), g('Cid'), 'Brasil'].filter(Boolean).join(', '); };
let tmr;
const auto = () => { clearTimeout(tmr); tmr = setTimeout(() => { if(temTarifa && $('oRua').value.trim() && $('dRua').value.trim() && !est) calcular().catch(() => {}); }, 2000); };
['oRua', 'oNum', 'oBai', 'oCid'].forEach(id => $(id).oninput = () => { pO = null; est = null; $('est').hidden = true; auto(); });
['dRua', 'dNum', 'dBai', 'dCid'].forEach(id => $(id).oninput = () => { pD = null; est = null; $('est').hidden = true; auto(); });

async function geoReverse(la, lo){
  try{
    const j = await (await fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&zoom=18&addressdetails=1&accept-language=pt-BR&lat=${la}&lon=${lo}`)).json(), a = j.address || {};
    const r = {rua: a.road || a.pedestrian || a.footway || a.residential || '', num: a.house_number || '', bai: a.suburb || a.neighbourhood || a.city_district || '', cid: a.city || a.town || a.village || a.municipality || ''};
    if(r.rua && r.bai) return r;
    const p = await geoRevPhoton(la, lo);
    return {rua: r.rua || p.rua, num: r.num || p.num, bai: r.bai || p.bai, cid: r.cid || p.cid};
  }catch(e){ return geoRevPhoton(la, lo); }
}
async function geoRevPhoton(la, lo){
  try{
    const f = ((await (await fetch(`https://photon.komoot.io/reverse?lat=${la}&lon=${lo}&limit=3`)).json()).features || []).map(x => x.properties || {}).find(p => p.street || p.name) || {};
    return {rua: f.street || (f.type === 'street' ? f.name : '') || '', num: f.housenumber || '', bai: f.district || f.locality || '', cid: f.city || f.county || ''};
  }catch(e){ return {rua:'', num:'', bai:'', cid:''}; }
}
async function geoFwd(t){
  try{
    const j = await (await fetch(`https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&countrycodes=br&accept-language=pt-BR&q=${encodeURIComponent(t)}`)).json();
    return j[0] ? {la:+j[0].lat, lo:+j[0].lon} : null;
  }catch(e){ return null; }
}
const norm = t => String(t || '').normalize('NFD').replace(/[^\x20-\x7E]/g, '').toLowerCase();
async function photon(q, cid){
  try{
    const c = norm(cid).trim(); if(!c) return null;
    const j = await (await fetch(`https://photon.komoot.io/api/?limit=6&lat=-22.37&lon=-41.79&q=${encodeURIComponent(q)}`)).json();
    const f = (j.features || []).find(x => { const p = x.properties || {}; return [p.city, p.county, p.locality, p.district].some(v => norm(v).includes(c)); });
    return f ? {la:f.geometry.coordinates[1], lo:f.geometry.coordinates[0]} : null;
  }catch(e){ return null; }
}
async function achar(p){
  const g = id => $(p + id).value.trim(), cid = g('Cid'), rua = g('Rua'), num = g('Num'), bai = g('Bai');
  const tries = [
    () => photon([rua + (num ? ' ' + num : ''), bai, cid].filter(Boolean).join(', '), cid),
    () => photon([rua, cid].join(', '), cid),
    () => geoFwd(addrQ(p)),
    () => geoFwd(addrQ(p, true))
  ];
  for(const t of tries){ const r = await t(); if(r) return r; }
  if(bai){ const r = await photon(bai + ', ' + cid, cid); if(r) return Object.assign(r, {aprox:true}); }
  return null;
}
let gps = false, outro = false;
function setOutro(v){
  outro = v; $('bMim').setAttribute('aria-pressed', !v); $('bOutro').setAttribute('aria-pressed', v);
  $('fPass').hidden = !v; $('loc').hidden = v;
  if(v && gps){ gps = false; pO = null; est = null; $('est').hidden = true; ['oRua', 'oNum', 'oBai'].forEach(id => $(id).value = ''); }
  $('sub').textContent = v ? 'Informe onde buscar o passageiro e para onde ele vai.' : 'Informe partida e destino e envie o pedido.';
}
$('bMim').onclick = () => setOutro(false); $('bOutro').onclick = () => setOutro(true);
$('loc').onclick = () => {
  const b = $('loc'); if(!navigator.geolocation){ b.textContent = 'Sem GPS'; return; }
  b.disabled = true; b.textContent = 'Localizando…';
  navigator.geolocation.getCurrentPosition(async p => {
    pO = {la:p.coords.latitude, lo:p.coords.longitude}; gps = true; est = null; $('est').hidden = true;
    const t = await geoReverse(pO.la, pO.lo) || {};
    $('oRua').value = t.rua || 'Minha localização atual (GPS)'; $('oNum').value = t.num || ''; $('oBai').value = t.bai || ''; if(t.cid) $('oCid').value = t.cid;
    if(!t.rua) $('oRua').select();
    if(temTarifa && $('dRua').value.trim()) calcular().catch(() => {});
    b.disabled = false; b.textContent = '📍 Usar minha localização';
  }, () => { b.disabled = false; b.textContent = '📍 Usar minha localização'; alert('Não consegui acessar a localização. Digite o endereço.'); }, {enableHighAccuracy:true, timeout:15000});
};
function hav(a, b){ const r = x => x*Math.PI/180, dLa = r(b.la - a.la), dLo = r(b.lo - a.lo), h = Math.sin(dLa/2)**2 + Math.cos(r(a.la))*Math.cos(r(b.la))*Math.sin(dLo/2)**2; return 2*6371*Math.asin(Math.sqrt(h)); }
async function calcular(){
  if((!pO && !$('oRua').value.trim()) || !$('dRua').value.trim()) throw new Error('Preencha a rua de partida e a de destino.');
  if(!pO) pO = await achar('o');
  if(!pD) pD = await achar('d');
  if(!pO || !pD) throw new Error('Não achei um dos endereços no mapa. Confira a rua e o bairro. Se preferir, envie assim mesmo: o motorista confirma o valor.');
  let km, min, aprox = !!(pO.aprox || pD.aprox);
  try{
    const j = await (await fetch(`https://router.project-osrm.org/route/v1/driving/${pO.lo},${pO.la};${pD.lo},${pD.la}?overview=false`)).json();
    const r = j.routes && j.routes[0]; if(!r) throw new Error('x');
    km = r.distance/1000; min = r.duration/60;
  }catch(e){ km = hav(pO, pD)*1.3; min = km/25*60; aprox = true; }
  const v = Math.max(T.band, km*T.km) + min*T.min;
  est = {km, min, v, aprox};
  $('est').hidden = false;
  $('est').innerHTML = `<small>Estimativa${aprox ? ' aproximada' : ''}</small><b>≈ R$ ${brl(v)}</b><small>${km.toLocaleString('pt-BR',{maximumFractionDigits:1})} km · cerca de ${Math.round(min)} min</small>`;
  return est;
}
async function estimar(){
  const eb = $('bEst'); eb.disabled = true; eb.textContent = 'Calculando…'; $('est').hidden = true; $('err').hidden = true;
  try{ await calcular(); }
  catch(e){ $('err').hidden = false; $('err').textContent = e.message || 'Falha ao calcular. Tente de novo.'; }
  eb.disabled = false; eb.textContent = 'Calcular estimativa de valor';
}
$('bEst').onclick = estimar;

$('f').onsubmit = async e => {
  e.preventDefault();
  const nome = $('nome').value.trim(), o = addr('o'), d = addr('d');
  if(!W){ return; }
  if(!nome || (!pO && !$('oRua').value.trim()) || !$('dRua').value.trim()){ $('err').hidden = false; $('err').textContent = 'Preencha nome, rua de partida e rua de destino.'; return; }
  if(outro && !$('pNome').value.trim()){ $('err').hidden = false; $('err').textContent = 'Informe o nome do passageiro.'; return; }
  $('err').hidden = true;
  let quando = 'Agora';
  if(agendar){
    const v = $('quando').value; if(!v){ $('err').hidden = false; $('err').textContent = 'Escolha a data e a hora.'; return; }
    quando = new Date(v).toLocaleString('pt-BR', {dateStyle:'short', timeStyle:'short'});
  }
  if(temTarifa && !est){ const g = $('go'); g.disabled = true; g.textContent = 'Calculando valor…'; try{ await calcular(); }catch(x){} g.disabled = false; g.textContent = 'Enviar pedido'; }
  const org = pO ? `${pO.la},${pO.lo}` : o, dst = pD ? `${pD.la},${pD.lo}` : d;
  const mapa = `https://www.google.com/maps/dir/?api=1&origin=${encodeURIComponent(org)}&destination=${encodeURIComponent(dst)}&travelmode=driving`;
  const L = ['*Stella Maris Ride · Pedido de corrida*', outro ? `Pedido feito por: ${nome}` : `Nome: ${nome}`];
  const fone = $('fone').value.trim(); if(fone) L.push(outro ? `Telefone de quem pediu: ${fone}` : `Telefone: ${fone}`);
  if(outro){ L.push(`*Passageiro: ${$('pNome').value.trim()}*`); const pf = $('pFone').value.trim(); if(pf) L.push(`Telefone do passageiro: ${pf}`); }
  L.push(`Quando: ${quando}`, `Partida: ${o}`, `Destino: ${d}`);
  if(est) L.push(`Estimativa: ≈ R$ ${brl(est.v)} (${est.km.toLocaleString('pt-BR',{maximumFractionDigits:1})} km${est.aprox ? ', aproximada' : ''})`);
  else if(temTarifa) L.push('Estimativa: a confirmar');
  const obs = $('obs').value.trim(); if(obs) L.push(`Obs.: ${obs}`);
  L.push(`Rota: ${mapa}`);
  const msg = L.join('\n'), wa = `https://wa.me/${W}?text=${encodeURIComponent(msg)}`;
  const g = $('go'); g.disabled = true; g.textContent = 'Enviando…';
  try{
    const db = await Promise.race([loadFB(), new Promise((_, rj) => setTimeout(() => rj(new Error('t')), 8000))]);
    const sid = db.ref().push().key, pid = db.ref().push().key, TS = firebase.database.ServerValue.TIMESTAMP;
    const m = Math.round(est ? est.min : 15) + 5;
    const f = {nome, fone, passageiro: outro ? $('pNome').value.trim() : '', foneP: outro ? $('pFone').value.trim() : '', partida: o, destino: d, obs, quando, estim: est ? `R$ ${brl(est.v)} · ${est.km.toLocaleString('pt-BR',{maximumFractionDigits:1})} km` : '', pid, c: TS, s: 'aguardando'};
    if(pO){ f.oLa = pO.la; f.oLo = pO.lo; } if(pD){ f.dLa = pD.la; f.dLo = pD.lo; }
    for(const k of ['nome', 'passageiro']) f[k] = f[k].slice(0, 80);
    f.partida = f.partida.slice(0, 200); f.destino = f.destino.slice(0, 200); f.obs = f.obs.slice(0, 300);
    const up = {}; up['fila/' + sid] = f; up['pub/' + pid] = {c: TS, s: 'aguardando', m};
    await Promise.race([db.ref().update(up), new Promise((_, rj) => setTimeout(() => rj(new Error('t')), 8000))]);
    const sv = {sid, pid, wa, t: Date.now()};
    try{ localStorage.setItem('sm_ped', JSON.stringify(sv)); }catch(x){}
    g.disabled = false; g.textContent = 'Enviar pedido';
    mostrar(sv);
  }catch(x){
    try{ firebase.database().goOffline(); }catch(y){}
    location.href = wa;
  }
};

// ---- fila ao vivo (Firebase) ----
const FBC = {"apiKey": "AIzaSyAMHd8SJb_Ts5Ji-_MbWDvwcjI_UGRYC4I", "authDomain": "stella-maris-ride.firebaseapp.com", "databaseURL": "https://stella-maris-ride-default-rtdb.firebaseio.com", "projectId": "stella-maris-ride", "storageBucket": "stella-maris-ride.firebasestorage.app", "messagingSenderId": "561195291545", "appId": "1:561195291545:web:3b926f9089c3d0ab3fb908"};
let fbp = null;
function loadFB(){
  if(fbp) return fbp;
  fbp = new Promise((res, rej) => {
    const urls = ['https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js', 'https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js'];
    let i = 0;
    const next = () => {
      if(i >= urls.length){ try{ firebase.initializeApp(FBC); res(firebase.database()); }catch(e){ rej(e); } return; }
      const sc = document.createElement('script'); sc.src = urls[i++]; sc.onload = next; sc.onerror = () => rej(new Error('sdk')); document.head.append(sc);
    };
    next();
  });
  fbp.catch(() => { fbp = null; });
  return fbp;
}
const ATIVOS = ['aguardando', 'aceito', 'a_caminho', 'chegou', 'em_corrida'];
const MSG = {
  aceito: ['Pedido aceito', 'O motorista aceitou e vai até você.'],
  a_caminho: ['Motorista a caminho', 'Fique no local de partida.'],
  chegou: ['Motorista chegou', 'Ele já está no local de partida.'],
  em_corrida: ['Corrida em andamento', 'Boa viagem!'],
  concluido: ['Corrida concluída', 'Obrigado por viajar com a Stella Maris Ride!'],
  cancelado: ['Pedido cancelado', 'Se foi engano, faça um novo pedido.']
};
let cur = null, off = null, canc = false;
function limpar(){ try{ localStorage.removeItem('sm_ped'); }catch(x){} if(off){ off(); off = null; } cur = null; canc = false; $('st').hidden = true; $('f').hidden = false; $('sub').hidden = false; }
function mostrar(sv){
  cur = sv; $('f').hidden = true; $('st').hidden = false; $('sub').hidden = true;
  $('stT').textContent = 'Pedido enviado'; $('stP').textContent = ''; $('stE').textContent = 'Conectando à fila…'; $('stD').textContent = '';
  $('stC').hidden = false; $('stN').hidden = true;
  loadFB().then(db => {
    const ref = db.ref('pub'), cb = ref.on('value', snap => desenhar(snap.val() || {}));
    off = () => ref.off('value', cb);
  }).catch(() => { $('stE').textContent = 'Sem conexão para acompanhar a fila agora. Seu pedido foi enviado.'; });
}
function desenhar(all){
  if(!cur) return;
  const me = all[cur.pid], lim = Date.now() - 12*3600*1000;
  if(!me){ $('stT').textContent = 'Pedido enviado'; $('stE').textContent = 'Aguardando confirmação…'; return; }
  const s = me.s;
  $('stC').hidden = !['aguardando', 'aceito', 'a_caminho'].includes(s) || canc;
  if(MSG[s]){
    $('stT').textContent = MSG[s][0]; $('stP').textContent = ''; $('stE').textContent = ''; $('stD').textContent = MSG[s][1];
    if(s === 'concluido' || s === 'cancelado'){ $('stC').hidden = true; $('stN').hidden = false; }
    return;
  }
  const ahead = Object.values(all).filter(x => x && ATIVOS.includes(x.s) && x.c > lim && x.c < me.c);
  const pos = ahead.length + 1, min = ahead.reduce((a, x) => a + (x.m || 15), 0);
  $('stT').textContent = pos === 1 ? 'Você é o próximo' : 'Você está na fila';
  $('stP').textContent = pos + 'º';
  $('stE').textContent = pos === 1 && !ahead.length ? 'Previsão de atendimento: em breve' : 'Previsão de atendimento: cerca de ' + Math.max(5, Math.round(min / 5) * 5) + ' min';
  $('stD').textContent = canc ? 'Cancelamento enviado ao motorista.' : 'Pedido por ordem de chegada. Esta tela se atualiza sozinha.';
}
$('stW').onclick = () => { if(cur) location.href = cur.wa; };
$('stN').onclick = limpar;
$('stC').onclick = async () => {
  if(!cur || !confirm('Cancelar o pedido?')) return;
  try{ const db = await loadFB(); await Promise.race([db.ref('cancelar/' + cur.sid).set(firebase.database.ServerValue.TIMESTAMP), new Promise((_, rj) => setTimeout(() => rj(new Error('t')), 8000))]); canc = true; $('stC').hidden = true; $('stD').textContent = 'Cancelamento enviado ao motorista.'; }
  catch(x){ alert('Não consegui cancelar agora. Avise o motorista pelo WhatsApp.'); }
};
try{ const sv = JSON.parse(localStorage.getItem('sm_ped') || 'null'); if(sv && sv.pid && Date.now() - sv.t < 12*3600*1000) mostrar(sv); else if(sv) localStorage.removeItem('sm_ped'); }catch(x){}
setTimeout(() => { loadFB().catch(() => {}); }, 1500);

})();
</script>
